# Builds the static globe assets and uploads them to R2 under assets/globe/:
# the land mask and coastline from Natural Earth, and the tide atlas from EOT20
# (DGFI-TUM, CC BY 4.0, via SEANOE). Also builds the station catalogue (NOAA CO-OPS
# stations and GeoNames coastal places, CC BY 4.0) into catalogue/. Run by hand when
# the art, the atlas or the catalogue changes; then run Site to rebuild the pages.
name: Static assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PRIVATE_BUCKET: ${{ secrets.R2_PRIVATE_BUCKET }}
      EOT20_URL: https://www.seanoe.org/data/00683/79489/data/85762.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[publish,tides]"
      # EOT20 is 2.3 GB and never changes: keep it between runs.
      - uses: actions/cache@v4
        with:
          path: eot20
          key: eot20-85762
      - name: Download EOT20
        run: |
          if [ ! -s eot20/eot20.zip ]; then
            mkdir -p eot20
            curl -fL --retry 3 -o eot20/eot20.zip.part "$EOT20_URL"
            mv eot20/eot20.zip.part eot20/eot20.zip
          fi
      - run: python -m pipeline static --cache "$RUNNER_TEMP/cache" --out "$RUNNER_TEMP/static"
      - run: python -m pipeline tide-atlas --eot20 eot20/eot20.zip --out "$RUNNER_TEMP/static"
      - run: python -m pipeline upload --src "$RUNNER_TEMP/static" --prefix assets/globe --max-age 604800 --store r2
      - run: python -m pipeline catalogue --inputs "$RUNNER_TEMP/catalogue-inputs" --out "$RUNNER_TEMP/catalogue"
      - run: python -m pipeline upload --src "$RUNNER_TEMP/catalogue" --prefix catalogue --max-age 86400 --store r2
      # Tide constants: NOAA harmonic constants and offsets (public domain), donors, and a global
      # model at every other station. EOT20 always; FES2022 first where the owner has uploaded
      # constants sampled from it (tools/fes2022_constants.py) to the optional private bucket.
      - run: python -m pipeline model-constants --catalogue "$RUNNER_TEMP/catalogue/stations.json" --eot20 eot20/eot20.zip --out "$RUNNER_TEMP/models/eot20.json"
      - name: FES2022 constants (private bucket, optional)
        if: env.R2_PRIVATE_BUCKET != ''
        run: |
          code=0
          python -m pipeline get --key fes2022/model-constants.json --out "$RUNNER_TEMP/models/fes2022.json" --store "r2:$R2_PRIVATE_BUCKET" || code=$?
          if [ "$code" -eq 3 ]; then
            echo "::notice::no fes2022/model-constants.json in the private bucket: EOT20 everywhere"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
      # One NOAA request per station per run is slow and impolite; responses rarely change.
      - uses: actions/cache@v4
        with:
          path: noaa-cache
          key: noaa-cache-${{ github.run_id }}
          restore-keys: noaa-cache-
      - run: python -m pipeline tide-constants --catalogue "$RUNNER_TEMP/catalogue/stations.json" --noaa "$RUNNER_TEMP/catalogue-inputs/noaa-tidepredictions.json" --noaa-cache noaa-cache --model "$RUNNER_TEMP/models/fes2022.json" --model "$RUNNER_TEMP/models/eot20.json" --out "$RUNNER_TEMP/tide-constants/tide-constants.json"
      # FES2022's licence covers our use, not passing its numbers on: with a private bucket the
      # constants live there (the Tides workflow reads them from it); otherwise they are EOT20
      # and NOAA only (CC BY 4.0 and public domain) and go next to the catalogue.
      - name: Upload tide constants
        run: |
          if [ -n "$R2_PRIVATE_BUCKET" ]; then
            python -m pipeline upload --src "$RUNNER_TEMP/tide-constants" --prefix tides-private --max-age 0 --store "r2:$R2_PRIVATE_BUCKET"
          else
            python -m pipeline upload --src "$RUNNER_TEMP/tide-constants" --prefix catalogue --max-age 86400 --store r2
          fi
