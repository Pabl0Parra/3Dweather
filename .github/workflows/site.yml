# Builds the web site (globe, regional maps, one page per station) and publishes it to
# the root of the R2 bucket, uploading only files that changed (spec §7). Station pages
# come from catalogue/stations.json in the bucket (built by the Static assets workflow).
# Every day it also rebuilds the station pages with that day's tides, sun and moon
# (python -m pipeline station-data). Without the R2 secrets (forks, or before setup) it
# builds and skips the upload.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily at 00:30 UTC. Each page holds its station's month and a curve for yesterday, today and
  # tomorrow, so the browser can move to the viewer's local today between rebuilds.
  schedule:
    - cron: '30 0 * * *'
  # A rebuilt catalogue (search.json) needs pages for its new paths straight away.
  workflow_run:
    workflows: [Static assets]
    types: [completed]

concurrency:
  group: site
  # A month's first run computes its sun and moon (~45 min): queue, never cancel it.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PRIVATE_BUCKET: ${{ secrets.R2_PRIVATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[publish,sky]"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Station catalogue
        run: |
          if [ -z "$R2_BUCKET" ]; then
            echo "::notice::R2 secrets are not set: building without station pages (see docs/deploy.md)"
            exit 0
          fi
          code=0
          python -m pipeline get --key catalogue/stations.json --out "$RUNNER_TEMP/stations.json" --store r2 || code=$?
          if [ "$code" -eq 3 ]; then
            echo "::notice::catalogue/stations.json is not in the bucket yet: run Static assets first"
          elif [ "$code" -ne 0 ]; then
            # Building without it would publish a site with no station pages.
            echo "::error::could not download the station catalogue"
            exit "$code"
          fi
          if [ "$code" -eq 0 ]; then
            # Next to stations.json: countries and regions, and popularity ranks, for the browse pages.
            python -m pipeline get --key catalogue/countries.json --out "$RUNNER_TEMP/countries.json" --store r2
            python -m pipeline get --key catalogue/search.json --out "$RUNNER_TEMP/search.json" --store r2
          fi
      - name: Tide constants
        run: |
          if [ ! -f "$RUNNER_TEMP/stations.json" ]; then exit 0; fi
          # With a private bucket the constants may hold FES2022 values and live there.
          code=0
          if [ -n "$R2_PRIVATE_BUCKET" ]; then
            python -m pipeline get --key tides-private/tide-constants.json --out "$RUNNER_TEMP/tide-constants.json" --store "r2:$R2_PRIVATE_BUCKET" || code=$?
          else
            python -m pipeline get --key catalogue/tide-constants.json --out "$RUNNER_TEMP/tide-constants.json" --store r2 || code=$?
          fi
          if [ "$code" -eq 3 ]; then
            echo "::notice::tide-constants.json is not in the bucket yet: station pages without tides data (run Static assets)"
          elif [ "$code" -ne 0 ]; then
            echo "::error::could not download the tide constants"
            exit "$code"
          fi
      # JPL DE421 (17 MB) once; each month's sun and moon data once per month (the first run of a
      # month computes it, about 45 minutes on 4 cores; later days reuse it). Last month's store
      # seeds the 1st, when western zones are still on the previous month.
      - uses: actions/cache@v4
        with:
          path: sky-cache
          key: de421
      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: sky-months
          key: sky-months-${{ steps.month.outputs.month }}-${{ github.run_id }}
          restore-keys: |
            sky-months-${{ steps.month.outputs.month }}-
            sky-months-
      - name: Station data
        id: sd
        run: |
          if [ ! -f "$RUNNER_TEMP/tide-constants.json" ]; then echo "computed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          python -m pipeline station-data --catalogue "$RUNNER_TEMP/stations.json" --constants "$RUNNER_TEMP/tide-constants.json" --out "$RUNNER_TEMP/station-data" --sky-cache sky-cache --sky-store sky-months --workers 4 | tee "$RUNNER_TEMP/station-data.log"
          echo "computed=$(sed -n 's/.*, \([0-9]*\) sky months computed.*/\1/p' "$RUNNER_TEMP/station-data.log")" >> "$GITHUB_OUTPUT"
      # Save only when this run computed months: one cache entry per month, not one per day.
      - uses: actions/cache/save@v4
        if: steps.sd.outputs.computed != '' && steps.sd.outputs.computed != '0'
        with:
          path: sky-months
          key: sky-months-${{ steps.month.outputs.month }}-${{ github.run_id }}
      - name: Build
        working-directory: web
        env:
          CATALOGUE_FILE: ${{ runner.temp }}/stations.json
          # The site's public address for canonical links and sitemaps (repository variable SITE_URL).
          SITE_URL: ${{ vars.SITE_URL }}
          STATION_DATA_DIR: ${{ runner.temp }}/station-data
          PUBLIC_TIDES_BASE: /tides
          PUBLIC_WX_BASE: /wx
          PUBLIC_ASSET_BASE: /assets/globe
          PUBLIC_CATALOGUE_BASE: /catalogue
        run: npm run build
      - name: Publish
        run: |
          if [ -z "$R2_BUCKET" ]; then
            echo "::notice::R2 secrets are not set: nothing published"
            exit 0
          fi
          python -m pipeline publish-site --dist web/dist --store r2
